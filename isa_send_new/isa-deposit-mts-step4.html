<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISA 입금 - 완료</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: white;
            color: #1A1C1E;
            max-width: 420px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        .top-nav {
            background: #454C73;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            color: white;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .nav-title {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            margin-right: 36px;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            font-size: 14px;
        }

        .nav-link {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-weight: 500;
        }

        .content {
            padding: 40px 20px;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #454C73;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .success-icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
        }

        .success-message {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #1A1C1E;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1A1C1E;
            margin-bottom: 16px;
        }

        .info-box {
            background: #F8F8F8;
            border-radius: 8px;
            padding: 0;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 16px;
            background: white;
            border-bottom: 1px solid #F0F0F0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 14px;
            color: #666;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #1A1C1E;
            text-align: right;
        }

        .info-value.highlight {
            color: #D32F2F;
            font-size: 16px;
        }

        .details-section {
            margin-top: 32px;
        }

        .detail-item {
            padding: 12px 0;
            border-bottom: 1px solid #F0F0F0;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-header {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 500;
            color: #1A1C1E;
        }

        .expandable-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 12px 0;
            border-bottom: 1px solid #F0F0F0;
        }

        .expandable-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .expandable-content.expanded {
            max-height: 500px;
        }

        .expandable-content-inner {
            padding: 16px 0;
            font-size: 13px;
            line-height: 1.8;
            color: #666;
        }

        .button-container {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            padding: 12px 16px;
            background: white;
            border-top: 1px solid #E0E0E0;
        }

        .main-button {
            width: 100%;
            padding: 16px;
            background: #454C73;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .main-button:active {
            background: #363B5C;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <button class="back-btn" onclick="goHome()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </button>
        <div class="nav-title">오픈뱅킹</div>
        <div class="nav-links">
            <a href="#" class="nav-link">서비스가입안내</a>
            <a href="#" class="nav-link">투자금자동충</a>
        </div>
    </nav>

    <div class="content">
        <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <path d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <div class="success-message">입금이 완료되었습니다.</div>

        <div class="section-title">내역</div>
        <div class="info-box">
            <div class="info-row">
                <span class="info-label">가져온 계좌</span>
                <span class="info-value" id="from-account">3022-0602 김태원<br>[위탁]</span>
            </div>
            <div class="info-row">
                <span class="info-label">받은 계좌</span>
                <span class="info-value highlight">6496-8447 김태원<br>[중개형ISA]</span>
            </div>
            <div class="info-row">
                <span class="info-label">입금된 금액</span>
                <span class="info-value highlight" id="amount">20,820원</span>
            </div>
            <div class="info-row">
                <span class="info-label">1일 잔여한도</span>
                <span class="info-value" id="remaining-limit">9,979,180원</span>
            </div>
        </div>

        <div class="details-section">
            <div class="expandable-header" onclick="toggleDetails()">
                <span class="section-title" style="margin: 0;">상세 내역</span>
                <span id="toggle-icon">▼</span>
            </div>
            <div class="expandable-content" id="details-content">
                <div class="expandable-content-inner">
                    <div style="margin-bottom: 12px;">
                        <div style="font-weight: 600; margin-bottom: 8px;">수수료</div>
                        <div>면제</div>
                    </div>
                    <div style="margin-bottom: 12px;">
                        <div style="font-weight: 600; margin-bottom: 8px;">받는계좌 표기</div>
                        <div>김태원</div>
                    </div>
                    <div>
                        <div style="font-weight: 600; margin-bottom: 8px;">내계좌 표기</div>
                        <div>김태원</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="button-container">
        <button class="main-button" onclick="goHome()">확인</button>
    </div>

    <script>
        window.onload = function() {
            const accountData = JSON.parse(sessionStorage.getItem('isaDepositFromAccount'));
            const amount = sessionStorage.getItem('isaDepositAmount');
            
            if (!accountData || !amount) {
                alert('입금 정보가 없습니다.');
                window.location.href = 'isa-deposit-mts-step1.html';
                return;
            }
            
            document.getElementById('from-account').innerHTML = 
                accountData.number + ' ' + accountData.name + '<br>[' + accountData.type + ']';
            document.getElementById('amount').textContent = amount + '원';
            
            // Calculate remaining limit (example)
            const currentLimit = 10000000;
            const transferAmount = parseInt(amount.replace(/,/g, ''));
            const remaining = currentLimit - transferAmount;
            document.getElementById('remaining-limit').textContent = remaining.toLocaleString() + '원';
        };

        function toggleDetails() {
            const content = document.getElementById('details-content');
            const icon = document.getElementById('toggle-icon');
            
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                icon.textContent = '▼';
            } else {
                content.classList.add('expanded');
                icon.textContent = '▲';
            }
        }

        function goHome() {
            // Clear session data
            sessionStorage.removeItem('isaDepositFromAccount');
            sessionStorage.removeItem('isaDepositAmount');
            sessionStorage.removeItem('isaDepositTime');
            
            alert('ISA 홈으로 이동합니다');
            // window.location.href = 'isa-home.html';
        }
    </script>
</body>
</html>
