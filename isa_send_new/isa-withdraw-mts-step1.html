<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISA 출금 - 계좌선택</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #F5F5F5;
            color: #1A1C1E;
            max-width: 420px;
            margin: 0 auto;
        }

        .top-nav {
            background: #454C73;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            color: white;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .nav-title {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            margin-right: 36px;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            font-size: 14px;
        }

        .nav-link {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
        }

        .content {
            background: white;
        }

        .section-header {
            padding: 20px 16px 12px;
            background: white;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1A1C1E;
            margin-bottom: 8px;
        }

        .section-subtitle {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .account-list {
            background: #F5F5F5;
            padding: 8px 0;
        }

        .account-item {
            background: white;
            margin-bottom: 8px;
            padding: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .account-item:active {
            background: #F8F8F8;
        }

        .account-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .account-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #454C73;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .account-info {
            flex: 1;
        }

        .account-number {
            font-size: 15px;
            font-weight: 600;
            color: #1A1C1E;
            margin-bottom: 2px;
        }

        .account-type {
            font-size: 13px;
            color: #666;
        }

        .account-arrow {
            color: #CCC;
            font-size: 20px;
        }

        .account-balance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #F0F0F0;
        }

        .balance-label {
            font-size: 13px;
            color: #666;
        }

        .balance-amount {
            font-size: 16px;
            font-weight: 700;
            color: #1A1C1E;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <button class="back-btn" onclick="history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </button>
        <div class="nav-title">입출금</div>
        <div class="nav-links">
            <a href="#" class="nav-link">이체내역조회</a>
            <a href="#" class="nav-link">해외입고안내</a>
        </div>
    </nav>

    <div class="content">
        <div class="section-header">
            <div class="section-title">입금받을 계좌를 선택하세요</div>
            <div class="section-subtitle">ISA에서 출금한 금액을 입금받을 계좌를 선택해주세요</div>
        </div>

        <div class="account-list">
            <div class="account-item" onclick="selectAccount('3022-0602', '김태원', '위탁', '1,416')">
                <div class="account-header">
                    <div class="account-icon">K</div>
                    <div class="account-info">
                        <div class="account-number">3022-0602 김태원</div>
                        <div class="account-type">[위탁]</div>
                    </div>
                    <div class="account-arrow">›</div>
                </div>
                <div class="account-balance-row">
                    <span class="balance-label">잔액</span>
                    <span class="balance-amount">1,416원</span>
                </div>
            </div>

            <div class="account-item" onclick="selectAccount('3022-0602', '김태원', '펀드', '1,014')">
                <div class="account-header">
                    <div class="account-icon">K</div>
                    <div class="account-info">
                        <div class="account-number">3022-0602 김태원</div>
                        <div class="account-type">[펀드]</div>
                    </div>
                    <div class="account-arrow">›</div>
                </div>
                <div class="account-balance-row">
                    <span class="balance-label">잔액</span>
                    <span class="balance-amount">1,014원</span>
                </div>
            </div>

            <div class="account-item" onclick="selectAccount('3022-0673', '김태원', '선물옵션', '0')">
                <div class="account-header">
                    <div class="account-icon">K</div>
                    <div class="account-info">
                        <div class="account-number">3022-0673 김태원</div>
                        <div class="account-type">[선물옵션]</div>
                    </div>
                    <div class="account-arrow">›</div>
                </div>
                <div class="account-balance-row">
                    <span class="balance-label">잔액</span>
                    <span class="balance-amount">0원</span>
                </div>
            </div>

            <div class="account-item" onclick="selectAccount('5111-5089', '김태원', '위탁종합', '1,926')">
                <div class="account-header">
                    <div class="account-icon">K</div>
                    <div class="account-info">
                        <div class="account-number">5111-5089 김태원</div>
                        <div class="account-type">[위탁종합]</div>
                    </div>
                    <div class="account-arrow">›</div>
                </div>
                <div class="account-balance-row">
                    <span class="balance-label">잔액</span>
                    <span class="balance-amount">1,926원</span>
                </div>
            </div>

            <div class="account-item" onclick="selectAccount('6359-2380', '김태원', '위탁종합', '209,669')">
                <div class="account-header">
                    <div class="account-icon">K</div>
                    <div class="account-info">
                        <div class="account-number">6359-2380 김태원</div>
                        <div class="account-type">[위탁종합]</div>
                    </div>
                    <div class="account-arrow">›</div>
                </div>
                <div class="account-balance-row">
                    <span class="balance-label">잔액</span>
                    <span class="balance-amount">209,669원</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function selectAccount(number, name, type, balance) {
            const accountData = {
                number: number,
                name: name,
                type: type,
                balance: balance
            };
            sessionStorage.setItem('isaWithdrawToAccount', JSON.stringify(accountData));
            window.location.href = 'isa-withdraw-mts-step2.html';
        }
    </script>
</body>
</html>
