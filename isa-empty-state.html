<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISA 계좌 개설</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #F5F5F5;
            color: #1A1C1E;
            max-width: 420px;
            margin: 0 auto;
        }

        .top-nav {
            background: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #E0E0E0;
        }

        .back-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }

        .nav-title {
            flex: 1;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-right: 32px;
        }

        .content {
            min-height: calc(100vh - 56px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Empty State */
        .empty-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #E8EAF6 0%, #C5CAE9 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .empty-title {
            font-size: 22px;
            font-weight: 700;
            color: #1A1C1E;
            margin-bottom: 8px;
            text-align: center;
        }

        .empty-subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.6;
        }

        /* 혜택 카드 */
        .benefits-container {
            width: 100%;
            margin-bottom: 32px;
        }

        .benefit-card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .benefit-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .benefit-icon.blue {
            background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
        }

        .benefit-icon.green {
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
        }

        .benefit-icon.purple {
            background: linear-gradient(135deg, #F3E5F5 0%, #E1BEE7 100%);
        }

        .benefit-content {
            flex: 1;
        }

        .benefit-title {
            font-size: 15px;
            font-weight: 700;
            color: #1A1C1E;
            margin-bottom: 4px;
        }

        .benefit-description {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

        .benefit-badge {
            padding: 4px 10px;
            background: #667EEA;
            color: white;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* 버튼 */
        .button-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #667EEA;
            border: 2px solid #667EEA;
        }

        .btn-secondary:active {
            background: #F8F9FF;
        }

        /* 간단 안내 */
        .info-box {
            background: #FFF9E6;
            border-left: 4px solid #FFC107;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            width: 100%;
        }

        .info-text {
            font-size: 12px;
            color: #E65100;
            line-height: 1.6;
        }

        .info-text strong {
            font-weight: 700;
            color: #E65100;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <button class="back-btn" onclick="history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </button>
        <div class="nav-title">ISA 잔고</div>
    </nav>

    <div class="content">
        <!-- Empty Icon -->
        <div class="empty-icon">💼</div>

        <!-- Title -->
        <div class="empty-title">보유하신 ISA 계좌가 없습니다</div>
        <div class="empty-subtitle">
            ISA 계좌를 개설하고<br>
            세금 혜택을 받아보세요
        </div>

        <!-- 혜택 카드 -->
        <div class="benefits-container">
            <div class="benefit-card">
                <div class="benefit-icon blue">💰</div>
                <div class="benefit-content">
                    <div class="benefit-title">비과세 혜택</div>
                    <div class="benefit-description">최대 400만원 비과세</div>
                </div>
                <div class="benefit-badge">핵심</div>
            </div>

            <div class="benefit-card">
                <div class="benefit-icon green">📈</div>
                <div class="benefit-content">
                    <div class="benefit-title">자유로운 투자</div>
                    <div class="benefit-description">예적금, 펀드, ETF 한 계좌에서</div>
                </div>
            </div>

            <div class="benefit-card">
                <div class="benefit-icon purple">🎁</div>
                <div class="benefit-content">
                    <div class="benefit-title">연금저축 추가 납입</div>
                    <div class="benefit-description">만기 시 연금계좌로 전환 가능</div>
                </div>
            </div>
        </div>

        <!-- 안내 -->
        <div class="info-box">
            <div class="info-text">
                💡 <strong>만 19세 이상</strong>이면 누구나 가입 가능하며, 
                <strong>3년 의무 보유</strong> 후 비과세 혜택을 받을 수 있습니다.
            </div>
        </div>

        <!-- 버튼 -->
        <div class="button-container">
            <button class="btn btn-primary" onclick="openAccount()">ISA 계좌 개설하기</button>
            <button class="btn btn-secondary" onclick="viewDetail()">ISA 자세히 알아보기</button>
        </div>
    </div>

    <script>
        function openAccount() {
            alert('ISA 계좌 개설 화면으로 이동합니다.');
        }

        function viewDetail() {
            alert('ISA 상품 안내 페이지로 이동합니다.');
        }
    </script>
</body>
</html>
